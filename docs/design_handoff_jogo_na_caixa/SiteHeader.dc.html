<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400..800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;background:#F1ECE3}a{color:#2D6B7D}a:hover{color:#E0812F}</style>
</helmet>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
<header style="background:#2D6B7D;color:#fff;font-family:'Nunito Sans',sans-serif">
  <div style="max-width:1200px;margin:0 auto;height:76px;display:flex;align-items:center;justify-content:space-between;gap:32px">
    <a style="display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none">
      <span style="position:relative;display:block;width:40px;height:40px;border-radius:10px;background:#F1ECE3;flex:none">
        <span style="position:absolute;left:8px;bottom:7px;width:11px;height:17px;background:#E0812F;border-radius:3px 0 0 3px"></span>
        <span style="position:absolute;left:19px;bottom:7px;width:13px;height:12px;background:#2D6B7D;border-radius:0 3px 3px 0"></span>
        <span style="position:absolute;left:15px;top:6px;width:14px;height:14px;background:#fff;border-radius:3.5px;box-shadow:0 1px 2px rgba(0,0,0,.25)"></span>
        <span style="position:absolute;left:20.5px;top:11.5px;width:3px;height:3px;border-radius:50%;background:#2D6B7D"></span>
      </span>
      <span style="font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:.06em;line-height:1">JOGO NA CAIXA</span>
    </a>
    <nav style="display:flex;align-items:center;gap:36px">
      <a style="position:relative;display:block;padding:10px 0;color:#fff;font-weight:700;font-size:15px;text-decoration:none">Acervo<span style="position:absolute;left:0;right:0;bottom:2px;height:3px;border-radius:2px;background:#E0812F;opacity:{{ onAcervo }}"></span></a>
      <a style="position:relative;display:block;padding:10px 0;color:#fff;font-weight:700;font-size:15px;text-decoration:none">Como funciona<span style="position:absolute;left:0;right:0;bottom:2px;height:3px;border-radius:2px;background:#E0812F;opacity:{{ onComo }}"></span></a>
      <a style="position:relative;display:block;padding:10px 0;color:#fff;font-weight:700;font-size:15px;text-decoration:none">Contato<span style="position:absolute;left:0;right:0;bottom:2px;height:3px;border-radius:2px;background:#E0812F;opacity:{{ onContato }}"></span></a>
    </nav>
    <a style="display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 8px 0 18px;border:1.5px solid rgba(255,255,255,.6);border-radius:999px;color:#fff;font-weight:700;font-size:14px;text-decoration:none" style-hover="background:rgba(255,255,255,.1)">Carrinho<span style="display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:#E0812F;font-weight:800;font-size:13px;line-height:1">0</span></a>
  </div>
</header>
</sc-if>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
<header style="background:#2D6B7D;color:#fff;font-family:'Nunito Sans',sans-serif">
  <div style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 28px;font-weight:700;font-size:15px">
    <span>9:41</span>
    <span style="display:flex;align-items:center;gap:7px">
      <span style="display:flex;align-items:flex-end;gap:1.5px"><span style="width:3px;height:4px;background:#fff;border-radius:1px"></span><span style="width:3px;height:6px;background:#fff;border-radius:1px"></span><span style="width:3px;height:8px;background:#fff;border-radius:1px"></span><span style="width:3px;height:10px;background:#fff;border-radius:1px"></span></span>
      <span style="display:block;width:25px;height:12px;border:1.5px solid rgba(255,255,255,.85);border-radius:4px;padding:1.5px"><span style="display:block;width:100%;height:100%;background:#fff;border-radius:2px"></span></span>
    </span>
  </div>
  <div style="height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px">
    <a style="display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none">
      <span style="position:relative;display:block;width:32px;height:32px;border-radius:8px;background:#F1ECE3;flex:none">
        <span style="position:absolute;left:6px;bottom:6px;width:9px;height:13px;background:#E0812F;border-radius:2px 0 0 2px"></span>
        <span style="position:absolute;left:15px;bottom:6px;width:10px;height:10px;background:#2D6B7D;border-radius:0 2px 2px 0"></span>
        <span style="position:absolute;left:12px;top:5px;width:11px;height:11px;background:#fff;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.25)"></span>
        <span style="position:absolute;left:16.25px;top:9.25px;width:2.5px;height:2.5px;border-radius:50%;background:#2D6B7D"></span>
      </span>
      <span style="font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:.06em;line-height:1">JOGO NA CAIXA</span>
    </a>
    <a style="display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 14px;border:1.5px solid rgba(255,255,255,.6);border-radius:999px;color:#fff;font-weight:700;font-size:13px;text-decoration:none">Carrinho<span style="display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#E0812F;font-weight:800;font-size:12px;line-height:1">0</span></a>
  </div>
</header>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;'desktop' | 'mobile'&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;acervo&quot;,&quot;como&quot;,&quot;contato&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, v = p.variant || 'desktop', a = p.active || 'inicio';
    return {
      isDesktop: v !== 'mobile', isMobile: v === 'mobile',
      onAcervo: a === 'acervo' ? 1 : 0, onComo: a === 'como' ? 1 : 0, onContato: a === 'contato' ? 1 : 0
    };
  }
}
</script>
</body>
</html>
