<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400..800&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;background:#F1ECE3}a{color:#2D6B7D}a:hover{color:#E0812F}</style>
</helmet>
<div style="position:relative;display:flex;flex-direction:column;height:100%;background:#FFFFFF;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(45,107,125,.05),0 8px 24px rgba(45,107,125,.08);font-family:'Nunito Sans',sans-serif;color:#454545">
  <div style="position:relative;aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#EAE3D7 0 10px,#E2DACC 10px 20px);color:#2D6B7D">
    <image-slot id="{{ slotId }}" shape="rect" placeholder="{{ photoLabel }}" style="position:absolute;inset:0;width:100%;height:100%;font-family:ui-monospace,Menlo,monospace;font-size:11px"></image-slot>
    <sc-if value="{{ isAvailable }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;top:10px;left:10px;padding:6px 10px;border-radius:999px;background:#3E8E5A;color:#fff;font-weight:800;font-size:12px;line-height:1;letter-spacing:.01em">Disponível</span></sc-if>
    <sc-if value="{{ isRented }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:10px;left:10px;padding:6px 10px;border-radius:999px;background:#B87333;color:#fff;font-weight:800;font-size:12px;line-height:1;letter-spacing:.01em">Volta {{ returnDate }}</span></sc-if>
    <sc-if value="{{ isMaintenance }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:10px;left:10px;padding:6px 10px;border-radius:999px;background:#8A857E;color:#fff;font-weight:800;font-size:12px;line-height:1;letter-spacing:.01em">Em manutenção</span></sc-if>
    <sc-if value="{{ isFeatured }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:10px;right:10px;padding:6px 10px;border-radius:999px;background:#E0812F;color:#fff;font-weight:800;font-size:12px;line-height:1;letter-spacing:.01em">Destaque</span></sc-if>
  </div>
  <sc-if value="{{ isRegular }}" hint-placeholder-val="{{ true }}">
  <div style="display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px;flex:1">
    <h3 style="margin:0;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:22px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;color:#2D6B7D">{{ gameName }}</h3>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      <span style="display:inline-flex;align-items:center;gap:6px;background:#F1ECE3;color:#454545;font-weight:700;font-size:12px;line-height:1;padding:6px 10px;border-radius:999px"><span style="display:inline-flex;flex:none"><span style="width:8px;height:8px;border-radius:50%;background:#2D6B7D"></span><span style="width:8px;height:8px;border-radius:50%;background:#2D6B7D;opacity:.55;margin-left:-3px"></span></span>{{ players }}</span>
      <span style="display:inline-flex;align-items:center;gap:6px;background:#F1ECE3;color:#454545;font-weight:700;font-size:12px;line-height:1;padding:6px 10px;border-radius:999px"><span style="position:relative;width:11px;height:11px;border:1.5px solid #2D6B7D;border-radius:50%;flex:none"><span style="position:absolute;left:50%;top:1px;width:1.5px;height:4px;background:#2D6B7D;transform:translateX(-50%)"></span></span>{{ duration }}</span>
      <span style="display:inline-flex;align-items:center;gap:6px;background:#F1ECE3;color:#454545;font-weight:700;font-size:12px;line-height:1;padding:6px 10px;border-radius:999px"><span style="position:relative;width:10px;height:10px;border-radius:3px;background:#2D6B7D;flex:none"><span style="position:absolute;left:3.5px;top:3.5px;width:3px;height:3px;border-radius:50%;background:#fff"></span></span>{{ complexity }}</span>
    </div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px">
      <div style="display:flex;flex-direction:column;gap:3px">
        <span style="font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;font-size:28px;line-height:1;color:#E0812F">R$ {{ price }}</span>
        <span style="font-size:12px;font-weight:600;line-height:1;color:rgba(69,69,69,.7)">por {{ period }}</span>
      </div>
      <sc-if value="{{ canRent }}" hint-placeholder-val="{{ true }}"><button style="appearance:none;border:0;cursor:pointer;background:#E0812F;color:#fff;font-family:inherit;font-weight:800;font-size:14px;height:40px;padding:0 18px;border-radius:12px;flex:none" style-hover="background:#C9711F">Alugar</button></sc-if>
      <sc-if value="{{ cannotRent }}" hint-placeholder-val="{{ false }}"><button style="appearance:none;cursor:pointer;background:transparent;border:1.5px solid #2D6B7D;color:#2D6B7D;font-family:inherit;font-weight:800;font-size:14px;height:40px;padding:0 16px;border-radius:12px;flex:none" style-hover="background:rgba(45,107,125,.08)">Avise-me</button></sc-if>
    </div>
  </div>
  </sc-if>
  <sc-if value="{{ isCompact }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;flex:1">
    <h3 style="margin:0;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:17px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;color:#2D6B7D">{{ gameName }}</h3>
    <div style="display:flex;flex-wrap:wrap;gap:4px">
      <span style="display:inline-flex;align-items:center;background:#F1ECE3;color:#454545;font-weight:700;font-size:11px;line-height:1;padding:5px 8px;border-radius:999px">{{ players }}</span>
      <span style="display:inline-flex;align-items:center;background:#F1ECE3;color:#454545;font-weight:700;font-size:11px;line-height:1;padding:5px 8px;border-radius:999px">{{ duration }}</span>
      <span style="display:inline-flex;align-items:center;background:#F1ECE3;color:#454545;font-weight:700;font-size:11px;line-height:1;padding:5px 8px;border-radius:999px">{{ complexity }}</span>
    </div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto;padding-top:4px">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;font-size:22px;line-height:1;color:#E0812F">R$ {{ price }}</span>
        <span style="font-size:11px;font-weight:600;line-height:1;color:rgba(69,69,69,.7)">por {{ period }}</span>
      </div>
      <sc-if value="{{ canRent }}" hint-placeholder-val="{{ true }}"><button style="appearance:none;border:0;cursor:pointer;background:#E0812F;color:#fff;font-family:inherit;font-weight:800;font-size:13px;height:40px;padding:0 12px;border-radius:10px;flex:none" style-hover="background:#C9711F">Alugar</button></sc-if>
      <sc-if value="{{ cannotRent }}" hint-placeholder-val="{{ false }}"><button style="appearance:none;cursor:pointer;background:transparent;border:1.5px solid #2D6B7D;color:#2D6B7D;font-family:inherit;font-weight:800;font-size:13px;height:40px;padding:0 10px;border-radius:10px;flex:none" style-hover="background:rgba(45,107,125,.08)">Avise-me</button></sc-if>
    </div>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:420},&quot;gameName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Azul&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Conteúdo&quot;},&quot;players&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2–4&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Conteúdo&quot;},&quot;duration&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;45 min&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Conteúdo&quot;},&quot;complexity&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Leve&quot;,&quot;Média&quot;,&quot;Pesada&quot;],&quot;default&quot;:&quot;Leve&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Conteúdo&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;40&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Conteúdo&quot;},&quot;period&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;7 dias&quot;,&quot;3 dias&quot;],&quot;default&quot;:&quot;7 dias&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Conteúdo&quot;},&quot;photoLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;foto real do exemplar na mesa&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Conteúdo&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;available&quot;,&quot;rented&quot;,&quot;maintenance&quot;],&quot;default&quot;:&quot;available&quot;,&quot;tsType&quot;:&quot;'available' | 'rented' | 'maintenance'&quot;,&quot;section&quot;:&quot;Estado&quot;},&quot;returnDate&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;18/09&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Estado&quot;},&quot;featured&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Estado&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Variante&quot;},&quot;slotId&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;card-azul&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, on = v => v === true || v === 'true';
    const status = p.status || 'available', compact = on(p.compact);
    const gameName = p.gameName ?? 'Azul';
    return {
      gameName, players: p.players ?? '2–4', duration: p.duration ?? '45 min', complexity: p.complexity ?? 'Leve',
      price: p.price ?? '40', period: p.period ?? '7 dias', returnDate: p.returnDate ?? '18/09',
      isAvailable: status === 'available', isRented: status === 'rented', isMaintenance: status === 'maintenance',
      canRent: status === 'available', cannotRent: status !== 'available',
      isFeatured: on(p.featured), isCompact: compact, isRegular: !compact,
      slotId: p.slotId ?? ('card-' + gameName.toLowerCase().replace(/[^a-z0-9]+/g, '-')),
      photoLabel: p.photoLabel ?? 'foto real do exemplar na mesa'
    };
  }
}
</script>
</body>
</html>
